<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f4;font-family:Arial,Helvetica,sans-serif;color:#222222;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f4f4;">
<tr>
<td align="center" style="padding:16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;background-color:#ffffff;border-radius:6px;">
<tr>
<td style="padding:24px 24px 8px 24px;">
<h1 style="margin:0 0 8px 0;font-size:22px;line-height:1.3;color:#1a3d6d;">{{title}}</h1>
<p style="margin:0;font-size:15px;line-height:1.5;">{{gregorianDate}}</p>
<p style="margin:0;font-size:15px;line-height:1.5;">{{hebrewDate}}</p>
<p dir="rtl" lang="he" style="margin:0;font-size:17px;line-height:1.5;text-align:right;">{{hebrewDateHe}}</p>
{{specialDate}}
</td>
</tr>
{{sections}}
</table>
</td>
</tr>
</table>
</body>
</html>
